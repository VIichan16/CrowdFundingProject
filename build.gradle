plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

application {
    mainClass = 'org.example.Main'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
['socketServer': 'org.example.socket.SocketServer', 'socketClient': 'org.example.socket.SocketClient', 'socketGui': 'org.example.socket.SocketDesktop'].each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = entryPoint
        if (taskName == 'socketClient') standardInput = System.in
    }
}

tasks.register('packetCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.socket.PacketCheck'
}
check.dependsOn packetCheck
